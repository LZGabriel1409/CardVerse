<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Cavaleiro de Ferro</title>
  <desc id="desc">Cavaleiro com armadura de ferro, espada e escudo.</desc>
  <defs>
