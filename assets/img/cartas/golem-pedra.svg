<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Golem de Pedra</title>
  <desc id="desc">Golem formado por rochas com olhos brilhantes diante das montanhas.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#41545b"/>
